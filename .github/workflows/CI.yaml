name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  checks:
    name: Quality checks
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/refresh') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run --if-present staticchecks

      - name: Build
        run: bun run --if-present build

      - name: Build Storybook
        run: bun run build-storybook

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Report all vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/trivy-results.json
          exit-code: "0"

      - name: Check fixable vulnerabilities
        run: trivy fs --cache-dir .cache/trivy --scanners vuln --ignore-unfixed --exit-code 1 .

      - name: Upload security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Dependency security report
          path: ${{ runner.temp }}/trivy-results.json
          retention-days: 5
          if-no-files-found: error
